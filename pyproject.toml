[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon"
version = "0.1.0"
description = "Synthetic people-analytics and data engineering case study on AI budget strain."
requires-python = ">=3.12"
dependencies = ["numpy", "polars", "duckdb", "pyarrow", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
